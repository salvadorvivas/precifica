<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Precifica — Salvador Vivas Advocacia</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F2F5;
    --surface:#ffffff;
    --surface-2:#E8EAEE;
    --ink:#26303C;
    --ink-soft:#5C6672;
    --ink-faint:#8B939C;
    --border:#DEE2E7;
    --accent:#1F3A6E;
    --accent-strong:#172C53;
    --accent-soft:#E7ECF5;
    --accent-ink:#ffffff;
    --brass:#1F3A6E;
    --brass-soft:#E7ECF5;
    --flag:#8C2F22;
    --flag-soft:#F5E3DF;
    --shadow: none;
    --logo-navy:#042B69;
    --logo-gray:#8C9197;
    --logo-ink:#232D36;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d141d;
      --surface:#131b26;
      --surface-2:#182230;
      --ink:#e8edf2;
      --ink-soft:#a3aebb;
      --ink-faint:#6d7885;
      --border:#28323f;
      --accent:#5b8fc7;
      --accent-strong:#7fabd9;
      --accent-soft:#1c2c3d;
      --accent-ink:#0a1520;
      --brass:#8fb3dd;
      --brass-soft:#1c2c3d;
      --flag:#de8067;
      --flag-soft:#3a241d;
      --shadow: none;
      --logo-navy:#8FB3DD;
      --logo-gray:#C5C9CE;
      --logo-ink:#E8EDF2;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d141d;
    --surface:#131b26;
    --surface-2:#182230;
    --ink:#e8edf2;
    --ink-soft:#a3aebb;
    --ink-faint:#6d7885;
    --border:#28323f;
    --accent:#5b8fc7;
    --accent-strong:#7fabd9;
    --accent-soft:#1c2c3d;
    --accent-ink:#0a1520;
    --brass:#8fb3dd;
    --brass-soft:#1c2c3d;
    --flag:#de8067;
    --flag-soft:#3a241d;
    --shadow: none;
    --logo-navy:#8FB3DD;
    --logo-gray:#C5C9CE;
    --logo-ink:#E8EDF2;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Archivo", -apple-system, sans-serif;
    font-size:14px;
    line-height:1.45;
  }
  img{max-width:100%}
  h1,h2,h3,.serif{ font-family:"Cormorant Garamond", Georgia, serif; text-wrap:balance; }
  .mono{ font-family:"JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  button, input, select, textarea{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; }
  a{ color:var(--accent-strong); }

  .app-shell{
    max-width:1280px;
    margin:0 auto;
    padding:28px 20px 64px;
    display:grid;
    grid-template-columns: 216px minmax(0,1fr) 320px;
    gap:24px;
    align-items:start;
  }
  .app-shell.pops-view{ grid-template-columns: 240px minmax(0,1fr); }


  /* ---- left rail ---- */
  .rail{
    position:sticky; top:20px;
    display:flex; flex-direction:column; gap:28px;
  }
  .view-switch{ display:flex; gap:3px; background:var(--surface-2); border-radius:0; padding:3px; }
  .view-switch button{
    all:unset; box-sizing:border-box; flex:1; text-align:center;
    padding:7px 6px; border-radius:0; font-size:12px; font-weight:600;
    color:var(--ink-soft); cursor:pointer;
  }
  .view-switch button.active{ background:var(--surface); color:var(--accent-strong); box-shadow:var(--shadow); }
  .pop-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px; max-height:calc(100vh - 220px); overflow-y:auto; }
  .pop-list button{
    all:unset; box-sizing:border-box;
    display:flex; align-items:center; gap:9px;
    width:100%; padding:8px 9px; border-radius:0;
    font-size:13px; color:var(--ink-soft);
  }
  .pop-list button .ic{ width:20px; height:20px; flex:none; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .pop-list button.active{ background:var(--accent-soft); color:var(--accent-strong); font-weight:600; }
  .pop-list button:hover{ background:var(--surface-2); }
  .pop-head{ padding:22px 24px 6px; }
  .pop-head .eyebrow{ display:flex; align-items:center; gap:8px; }
  .pop-head h1{ font-size:28px; margin:6px 0 6px; font-weight:600; line-height:1.1; }
  .pop-head p{ margin:0 0 4px; color:var(--ink-soft); font-size:14px; max-width:68ch; }
  .pop-actions{ display:flex; gap:8px; padding:4px 24px 20px; }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .mark{
    width:52px; height:56px; border-radius:0;
    background:transparent; color:transparent;
    display:block;
    margin-bottom:10px;
  }
  .brand .mark svg{ width:100%; height:100%; display:block; }
  .brand .name{ font-family:"Cormorant Garamond",serif; font-weight:600; font-size:23px; color:var(--accent); line-height:1; }
  .brand .tagline{ font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-faint); margin-top:3px; }

  .steps{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
  .steps button{
    all:unset; box-sizing:border-box;
    display:flex; align-items:center; gap:10px;
    width:100%; padding:9px 10px; border-radius:0;
    font-size:13.5px; color:var(--ink-soft);
  }
  .steps button .n{
    width:20px; height:20px; border-radius:50%; flex:none;
    border:1px solid var(--border); font-size:11px;
    display:flex; align-items:center; justify-content:center;
    font-family:"JetBrains Mono",monospace;
  }
  .steps button.active{ background:var(--accent-soft); color:var(--accent-strong); font-weight:600; }
  .steps button.active .n{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .steps button.done .n{ background:var(--surface-2); border-color:var(--border); color:var(--ink-soft); }
  .steps button:disabled{ opacity:.45; cursor:not-allowed; }

  .rail-foot{ margin-top:auto; display:flex; flex-direction:column; gap:6px; }
  .ghost-btn{
    all:unset; box-sizing:border-box; display:flex; align-items:center; gap:8px;
    font-size:13px; color:var(--ink-soft); padding:8px 10px; border-radius:0;
  }
  .ghost-btn:hover{ background:var(--surface-2); color:var(--ink); }

  /* ---- main column ---- */
  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:0; box-shadow:var(--shadow);
  }
  .step-head{ padding:22px 24px 4px; }
  .eyebrow{ font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--brass); font-weight:500; }
  .step-head h1{ font-size:30px; margin:6px 0 4px; font-weight:600; line-height:1.1; }
  .step-head p{ margin:0 0 6px; color:var(--ink-soft); font-size:14.5px; max-width:60ch; }

  .niche-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:12px; padding:18px 24px 24px;
  }
  .niche-card{
    all:unset; box-sizing:border-box;
    border:1px solid var(--border); border-radius:0; padding:16px;
    display:flex; flex-direction:column; gap:8px; background:var(--surface);
    transition:border-color .12s, background .12s;
  }
  .niche-card:hover{ border-color:var(--accent); }
  .niche-card.selected{ border-color:var(--accent); background:var(--surface); box-shadow:inset 0 3px 0 var(--accent); }
  .niche-card .icon{ font-size:22px; }
  .niche-card .label{ font-weight:600; font-size:15px; }
  .niche-card .meta{ font-size:12px; color:var(--ink-soft); }
  .niche-card .base{ font-size:12.5px; color:var(--brass); font-family:"JetBrains Mono",monospace; margin-top:auto; }
  .niche-add{
    border:1px dashed var(--border); border-radius:0; padding:16px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    color:var(--ink-soft); font-size:13px; background:transparent;
  }
  .niche-add:hover{ border-color:var(--ink-faint); color:var(--ink); }

  .scope-list{ list-style:none; margin:0; padding:6px 24px 22px; display:flex; flex-direction:column; gap:0; }
  .scope-group{ padding:14px 0; border-top:1px solid var(--border); }
  .scope-group:first-child{ border-top:none; }
  .scope-group h3{ font-size:10.5px; text-transform:uppercase; letter-spacing:.18em; color:var(--brass); font-weight:500; margin:0 0 10px; font-family:"JetBrains Mono",monospace; }
  .scope-item{ display:flex; gap:10px; padding:6px 0; font-size:14px; align-items:flex-start; }
  .scope-item .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); margin-top:8px; flex:none; }

  .q-list{ display:flex; flex-direction:column; gap:12px; padding:16px 24px 24px; }
  .q-card{ border:1px solid var(--border); border-radius:0; padding:16px 18px; }
  .q-card .q-label{ font-weight:600; font-size:14.5px; margin-bottom:2px; }
  .q-card .q-hint{ font-size:12.5px; color:var(--ink-soft); margin-bottom:12px; }
  .q-opts{ display:flex; gap:8px; flex-wrap:wrap; }
  .opt-btn{
    all:unset; box-sizing:border-box;
    padding:8px 14px; border-radius:0; border:1px solid var(--border);
    font-size:13.5px; color:var(--ink-soft);
  }
  .opt-btn:hover{ border-color:var(--accent); }
  .opt-btn.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  .opt-btn .pct{ font-family:"JetBrains Mono",monospace; font-size:11px; opacity:.8; margin-left:6px; }

  .step-nav{ display:flex; justify-content:space-between; padding:4px 24px 24px; gap:10px; }
  .btn{
    all:unset; box-sizing:border-box; padding:10px 18px; border-radius:0;
    font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ background:var(--accent-strong); }
  .btn-secondary{ border:1px solid var(--border); color:var(--ink-soft); }
  .btn-secondary:hover{ color:var(--ink); border-color:var(--ink-faint); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  .empty-note{ padding:18px 24px 26px; color:var(--ink-soft); font-size:14px; }

  /* ---- right summary rail ---- */
  .summary{ position:sticky; top:20px; display:flex; flex-direction:column; gap:14px; }
  .summary .card{ padding:20px; }
  .summary h2{ font-size:10.5px; text-transform:uppercase; letter-spacing:.18em; color:var(--ink-faint); font-weight:500; margin:0 0 14px; font-family:"JetBrains Mono",monospace; }
  .sum-niche{ display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px; margin-bottom:14px; }
  .sum-line{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px; padding:5px 0; color:var(--ink-soft); }
  .sum-line b{ color:var(--ink); font-weight:500; }
  .factor-chip{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px;
    background:var(--surface-2); border-radius:999px; padding:3px 9px; margin:2px 4px 2px 0;
    font-family:"JetBrains Mono",monospace; color:var(--ink-soft);
  }
  .factor-chip.on{ background:var(--brass-soft); color:var(--brass); }
  .hero-figure{
    background:var(--accent); color:var(--accent-ink); border-radius:0;
    padding:18px 20px; margin:14px 0 12px;
  }
  .hero-figure .label{ font-family:"JetBrains Mono",monospace; font-size:10px; text-transform:uppercase; letter-spacing:.16em; opacity:.85; }
  .hero-figure .value{ font-family:"JetBrains Mono",monospace; font-size:30px; font-weight:600; margin-top:4px; }
  .sub-figures{ display:flex; flex-direction:column; gap:0; }
  .sub-figures .sum-line{ border-top:1px solid var(--border); }
  .sub-figures .sum-line:first-child{ border-top:none; }
  .proj-row input{
    width:44px; background:var(--surface-2); border:1px solid var(--border); border-radius:0;
    text-align:center; font-family:"JetBrains Mono",monospace; font-size:12.5px; padding:2px 4px;
  }
  .disclaimer{ font-size:11.5px; color:var(--ink-faint); border-top:1px solid var(--border); margin-top:12px; padding-top:12px; }
  .copy-btn{ width:100%; justify-content:center; margin-top:4px; }

  /* ---- settings drawer ---- */
  .backdrop{
    position:fixed; inset:0; background:rgba(10,14,11,.45); z-index:40;
    display:flex; justify-content:flex-end;
  }
  .drawer{
    width:min(480px,100%); height:100%; background:var(--bg); border-left:1px solid var(--border);
    overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:20px;
  }
  .drawer-head{ display:flex; justify-content:space-between; align-items:center; }
  .drawer-head h2{ font-size:19px; margin:0; }
  .icon-btn{ all:unset; padding:6px; border-radius:0; color:var(--ink-soft); }
  .icon-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .field-label{ font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; display:block; }
  .field{ margin-bottom:12px; }
  .field input[type=text], .field input[type=number], .field textarea{
    width:100%; border:1px solid var(--border); border-radius:0; padding:8px 10px;
    background:var(--surface); font-size:13.5px;
  }
  .field textarea{ min-height:90px; resize:vertical; font-family:"Archivo",sans-serif; }
  .niche-edit{ border:1px solid var(--border); border-radius:0; padding:14px; display:flex; flex-direction:column; gap:2px; }
  .niche-edit-top{ display:flex; gap:8px; align-items:flex-start; }
  .niche-edit-top .field{ flex:1; margin-bottom:0; }
  .icon-field input{ width:52px; text-align:center; font-size:18px; }
  .base-field input{ width:110px; }
  .remove-niche{ align-self:flex-end; font-size:12px; color:var(--flag); background:none; border:none; margin-top:6px; }
  .weight-row{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .weight-row label{ flex:1; font-size:13px; }
  .weight-row input[type=range]{ width:110px; accent-color:var(--accent); }
  .weight-row .wv{ width:46px; text-align:right; font-family:"JetBrains Mono",monospace; font-size:12.5px; color:var(--brass); }
  .save-bar{ position:sticky; bottom:0; background:var(--bg); padding-top:10px; }
  .status-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }

  [hidden]{ display:none !important; }
  ::selection{ background:var(--accent-soft); }

  @media (max-width: 980px){
    .app-shell, .app-shell.pops-view{ grid-template-columns: minmax(0,1fr); padding:16px 12px 48px; gap:16px; }
    .rail{ position:static; gap:14px; min-width:0; max-width:100%; }
    .pop-list{ min-width:0; max-width:100%; }
    .brand{ flex-direction:row; align-items:center; gap:10px; flex-wrap:wrap; }
    .brand .mark{ margin-bottom:0; width:40px; height:44px; }
    .brand .tagline{ width:100%; }
    .steps{ flex-direction:row; flex-wrap:wrap; gap:6px; }
    .steps li{ flex:none; }
    .steps button{ width:auto; padding:7px 12px; border:1px solid var(--border); border-radius:0; background:var(--surface); }
    .steps button.active{ border-color:var(--accent); }
    .pop-list{ flex-direction:row; flex-wrap:nowrap; overflow-x:auto; max-height:none; gap:6px; padding-bottom:6px; -webkit-overflow-scrolling:touch; }
    .pop-list li{ flex:none; }
    .pop-list button{ width:auto; white-space:nowrap; border:1px solid var(--border); border-radius:0; padding:7px 12px; background:var(--surface); }
    .pop-list button.active{ border-color:var(--accent); }
    .rail-foot{ margin-top:0; flex-direction:row; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:2px; }
    .summary{ position:static; }
    .step-head{ padding:18px 16px 4px; }
    .step-head h1{ font-size:21px; }
    .pop-head{ padding:18px 16px 6px; }
    .pop-head h1{ font-size:20px; }
    .niche-grid{ padding:14px 16px 18px; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
    .scope-list{ padding:6px 16px 18px; }
    .q-list{ padding:14px 16px 18px; }
    .step-nav{ padding:4px 16px 18px; }
    .pop-actions{ flex-wrap:wrap; padding:4px 16px 18px; }
    .hero-figure .value{ font-size:26px; }
    .drawer{ width:100%; padding:18px 14px; }
    .niche-edit-top{ flex-wrap:wrap; }
    .niche-edit-top .field{ min-width:120px; }
    .field input[type=text], .field input[type=number], .field textarea{ font-size:16px; }
  }
</style>
</head>
<body>

<div class="app-shell" id="app"></div>

  function applyRoute(){

    try{ slug = decodeURIComponent(slug); }catch(e){}
    slug = slug.replace(/^\/+|\/+$/g,'').toLowerCase();
    if(!slug) return;
    const pop = state.pops.find(p=>p.id.toLowerCase()===slug);
    if(pop){ state.view='pops'; state.selectedPopId = pop.id; return; }
    const niche = state.niches.find(n=>n.id.toLowerCase()===slug);
    if(niche){ state.view='precifica'; state.selectedNicheId = niche.id; }
  }

    try{ history.replaceState(null, '', slug ? '/'+slug : '/'); }catch(e){}

    let m = 1;

  function renderRail(){
    const rail = el('div','rail');

    const brand = el('div','brand');
    brand.innerHTML = `
      <div class="mark">${BRAND_MARK}</div>
      <div class="name">Precifica</div>
      <div class="tagline">Salvador Vivas Advocacia · assessoria empresarial</div>
    `;
    rail.appendChild(brand);

    const switcher = el('div','view-switch');
    const bPrecifica = el('button', state.view==='precifica'?'active':'', 'Precificação');
    bPrecifica.onclick = ()=>{ state.view='precifica'; setRoute(state.selectedNicheId||''); render(); };
    const bPops = el('button', state.view==='pops'?'active':'', 'POPs internos');
    bPops.onclick = ()=>{ state.view='pops'; setRoute(state.selectedPopId||''); render(); };
    switcher.appendChild(bPrecifica); switcher.appendChild(bPops);
    rail.appendChild(switcher);

    if(state.view==='precifica'){
      const steps = el('ul','steps');
      const items = [
        {n:1, label:'Nicho', enabled:true},
        {n:2, label:'Escopo', enabled:!!state.selectedNicheId},
        {n:3, label:'Perfil do cliente', enabled:!!state.selectedNicheId},
      ];
      items.forEach(it=>{
        const li = el('li');
        const b = el('button', (state.step===it.n?'active':'') + (state.step>it.n?' done':''));
        b.disabled = !it.enabled;
        b.innerHTML = `<span class="n">${state.step>it.n?'✓':it.n}</span><span>${it.label}</span>`;
        b.onclick = ()=>{ if(it.enabled){ state.step = it.n; render(); } };
        li.appendChild(b);
        steps.appendChild(li);
      });
      rail.appendChild(steps);
    } else {
      const list = el('ul','pop-list');
      state.pops.slice().sort((a,b)=>a.order-b.order).forEach(p=>{
        const li = el('li');
        const b = el('button', state.selectedPopId===p.id?'active':'');
        b.innerHTML = `<span class="ic">${p.icon||'📄'}</span><span>${p.label}</span>`;
        b.onclick = ()=>{ state.selectedPopId = p.id; setRoute(p.id); render(); };
        li.appendChild(b);
        list.appendChild(li);
      });
      rail.appendChild(list);
    }

    const foot = el('div','rail-foot');
    if(state.view==='precifica'){
      const cfgBtn = el('button','ghost-btn','⚙️&nbsp;&nbsp;Configurar nichos e pesos');
      cfgBtn.onclick = ()=>{ state.settingsOpen = true; render(); };
      foot.appendChild(cfgBtn);
    } else {
      const cfgBtn = el('button','ghost-btn','⚙️&nbsp;&nbsp;Configurar setores');
      cfgBtn.onclick = ()=>{ state.popSettingsOpen = true; render(); };
      foot.appendChild(cfgBtn);
    }
    const status = el('div','ghost-btn');
    const ok = state.dbStatus==='live' || state.dbStatus==='local';
    const dot = ok ? '#4c9a72' : (state.dbStatus==='offline' ? '#a8452e' : '#c8ab6a');
    const txt = state.dbStatus==='live' ? 'Ajustes salvos na nuvem'
      : state.dbStatus==='local' ? 'Ajustes salvos neste navegador'
      : state.dbStatus==='offline' ? 'Usando valores locais' : 'Sincronizando…';
    status.innerHTML = `<span class="status-dot" style="background:${dot}"></span>${txt}`;
    status.style.fontSize = '11.5px';
    status.style.color = 'var(--ink-faint)';
    foot.appendChild(status);
    rail.appendChild(foot);

    return rail;
  }

  function renderMain(){
    const main = el('div','main');
    const card = el('div','card');

    if(state.view==='pops'){
      card.appendChild(renderPopMain());
    } else if(state.step===1) card.appendChild(renderStepNicho());
    else if(state.step===2) card.appendChild(renderStepEscopo());
    else card.appendChild(renderStepPerfil());

    main.appendChild(card);
    return main;
  }

  function renderPopMain(){
    const wrap = el('div');
    const p = selectedPop();
    if(!p){
      wrap.appendChild(el('div','empty-note','Nenhum setor cadastrado ainda. Use "Configurar setores" para adicionar o primeiro.'));
      return wrap;
    }
    wrap.appendChild(el('div','pop-head', `
      <div class="eyebrow">POP · Procedimento Operacional Padrão</div>
      <h1>${p.icon||'📄'} ${p.label}</h1>
      <p>${p.resumo||''}</p>
    `));
    const list = el('div','scope-list');
    (p.docs||[]).forEach(g=>{
      const grp = el('div','scope-group');
      grp.appendChild(el('h3', null, g.group));
      g.items.forEach(it=>{
        const row = el('div','scope-item');
        row.innerHTML = `<span class="dot"></span><span>${it}</span>`;
        grp.appendChild(row);
      });
      list.appendChild(grp);
    });
    wrap.appendChild(list);

    const actions = el('div','pop-actions');
    const copyBtn = el('button','btn btn-secondary','📋 Copiar conteúdo deste POP');
    copyBtn.onclick = ()=>{
      const text = `${p.label}\n${p.resumo||''}\n` +
        (p.docs||[]).map(g=>`\n${g.group}:\n`+g.items.map(i=>'- '+i).join('\n')).join('\n');
      navigator.clipboard && navigator.clipboard.writeText(text);
      copyBtn.textContent = '✓ Copiado';
      setTimeout(()=>{ copyBtn.innerHTML = '📋 Copiar conteúdo deste POP'; }, 1600);
    };
    actions.appendChild(copyBtn);
    const editBtn = el('button','btn btn-secondary','✎ Ajustar este setor');
    editBtn.onclick = ()=>{ state.popSettingsOpen = true; render(); };
    actions.appendChild(editBtn);
    wrap.appendChild(actions);

    return wrap;
  }

  function renderStepNicho(){
    const wrap = el('div');
    wrap.appendChild(el('div','step-head', `
      <div class="eyebrow">Etapa 1 de 3</div>
      <h1>Selecione o nicho</h1>
      <p>Escolha o segmento do cliente para carregar o escopo de serviços e a base de honorários já calibrada para esse tipo de negócio.</p>
    `));
    const grid = el('div','niche-grid');
    state.niches.sort((a,b)=>a.order-b.order).forEach(n=>{
      const c = el('button','niche-card'+(state.selectedNicheId===n.id?' selected':''));
      const docCount = n.docs.reduce((s,g)=>s+g.items.length,0);
      c.innerHTML = `
        <div class="icon">${n.icon||'🏢'}</div>
        <div class="label">${n.label}</div>
        <div class="meta">${docCount} itens de escopo</div>
        <div class="base">${fmtBRL(n.baseFee)}/mês · base</div>
      `;
      c.onclick = ()=>{ state.selectedNicheId = n.id; setRoute(n.id); render(); };
      grid.appendChild(c);
    });
    const add = el('button','niche-add','+ Adicionar nicho em Configurações');
    add.onclick = ()=>{ state.settingsOpen = true; render(); };
    grid.appendChild(add);
    wrap.appendChild(grid);

    wrap.appendChild(renderNav(false, !!state.selectedNicheId, ()=>{ state.step=2; render(); }));
    return wrap;
  }

  function renderStepEscopo(){
    const wrap = el('div');
    const n = selectedNiche();
    wrap.appendChild(el('div','step-head', `
      <div class="eyebrow">Etapa 2 de 3</div>
      <h1>Escopo da assessoria — ${n?n.label:''}</h1>
      <p>Itens que compõem o pacote de assessoria preventiva e consultiva para este segmento, organizados pelas áreas de atuação do escritório.</p>
    `));
    if(!n){
      wrap.appendChild(el('div','empty-note','Selecione um nicho na etapa anterior.'));
    } else {
      const list = el('div','scope-list');
      n.docs.forEach(g=>{
        const grp = el('div','scope-group');
        grp.appendChild(el('h3', null, g.group));
        g.items.forEach(it=>{
          const row = el('div','scope-item');
          row.innerHTML = `<span class="dot"></span><span>${it}</span>`;
          grp.appendChild(row);
        });
        list.appendChild(grp);
      });
      wrap.appendChild(list);
    }
    wrap.appendChild(renderNav(true, true, ()=>{ state.step=1; render(); }, ()=>{ state.step=3; render(); }));
    return wrap;
  }

  function renderStepPerfil(){
    const wrap = el('div');
    wrap.appendChild(el('div','step-head', `
      <div class="eyebrow">Etapa 3 de 3</div>
      <h1>Perfil do cliente</h1>
      <p>Responda às perguntas abaixo para ajustar o honorário-base à complexidade real deste cliente. O resultado aparece no resumo ao lado.</p>
    `));
    const list = el('div','q-list');
    FACTORS.forEach(f=>{
      const card = el('div','q-card');
      card.appendChild(el('div','q-label', f.label));
      card.appendChild(el('div','q-hint', f.hint));
      const opts = el('div','q-opts');
      f.opts.forEach(o=>{
        const b = el('button','opt-btn'+(state.answers[f.key]===o.v?' active':''));
        const pct = o.v===1 ? `<span class="pct">+${state.settings.weights[f.key]}%</span>` : '';
        b.innerHTML = o.l + pct;
        b.onclick = ()=>{ state.answers[f.key]=o.v; render(); };
        opts.appendChild(b);
      });
      card.appendChild(opts);
      list.appendChild(card);
    });
    wrap.appendChild(list);
    wrap.appendChild(renderNav(true, false, ()=>{ state.step=2; render(); }));

  }

  function renderNav(showBack, showNext, onBack, onNext){
    const nav = el('div','step-nav');
    const back = el('button','btn btn-secondary','← Voltar');
    back.style.visibility = showBack ? 'visible' : 'hidden';
    back.onclick = onBack;
    nav.appendChild(back);
    if(showNext){
      const next = el('button','btn btn-primary','Próximo →');
      next.onclick = onNext;
      nav.appendChild(next);
    } else {
      nav.appendChild(el('span'));
    }
    return nav;
  }

  function renderSummary(){
    const wrap = el('div','summary');
    const card = el('div','card');
    card.appendChild(el('h2', null, 'Resumo do orçamento'));

    const n = selectedNiche();
    if(!n){
      card.appendChild(el('div','empty-note','Escolha um nicho para ver a estimativa de honorários.'));
      wrap.appendChild(card);
      return wrap;
    }

    card.appendChild(el('div','sum-niche', `${n.icon||''} ${n.label}`));

    const chips = el('div');
    FACTORS.forEach(f=>{
      const on = state.answers[f.key]===1;
      const chip = el('span','factor-chip'+(on?' on':''));
      chip.textContent = (on ? '+'+state.settings.weights[f.key]+'%' : '—') + ' ' + f.short;
      chips.appendChild(chip);
    });
    card.appendChild(chips);

    const monthly = computeMonthly();
    const hero = el('div','hero-figure');
    hero.innerHTML = `<div class="label">Honorário mensal sugerido</div><div class="value mono">${fmtBRL(monthly)}</div>`;
    card.appendChild(hero);

    const subs = el('div','sub-figures');
    subs.appendChild(rowLine('Base do nicho', fmtBRL(n.baseFee)));
    subs.appendChild(rowLine('Multiplicador aplicado', '×' + computeMultiplier().toFixed(2)));
    subs.appendChild(rowLine('Valor anual do contrato', fmtBRL(monthly*12)));
    card.appendChild(subs);

    const projRow = el('div','sum-line proj-row');
    const projInput = el('input');
    projInput.type='number'; projInput.min=1; projInput.max=99;
    projInput.value = state.settings.projectionContracts;
    projInput.oninput = (e)=>{ state.settings.projectionContracts = Math.max(1, parseInt(e.target.value||'1',10)); renderSummaryOnly(); };
    projRow.innerHTML = `<span>Projeção — <span id="proj-n-slot"></span> contratos</span>`;
    projRow.querySelector('#proj-n-slot').appendChild(projInput);
    const projVal = el('b', null, fmtBRL(monthly*state.settings.projectionContracts) + '/mês');
    projRow.appendChild(projVal);
    card.appendChild(projRow);

    const copyBtn = el('button','btn btn-secondary copy-btn','📋 Copiar resumo para proposta');
    copyBtn.onclick = ()=>{
      const text = `${n.label} — Proposta de assessoria\n\nHonorário mensal: ${fmtBRL(monthly)}\nValor anual do contrato: ${fmtBRL(monthly*12)}\n\nEscopo incluído:\n` +
        n.docs.map(g=>`\n${g.group}:\n`+g.items.map(i=>'- '+i).join('\n')).join('\n');
      navigator.clipboard && navigator.clipboard.writeText(text);
      copyBtn.textContent = '✓ Copiado';
      setTimeout(()=>{ copyBtn.innerHTML = '📋 Copiar resumo para proposta'; }, 1600);
    };
    card.appendChild(copyBtn);

    card.appendChild(el('div','disclaimer','Estimativa de referência. O valor final depende da análise concreta do caso e não substitui a negociação direta com o cliente.'));

    wrap.appendChild(card);
    return wrap;
  }

  function rowLine(label, value){
    const r = el('div','sum-line');
    r.innerHTML = `<span>${label}</span><b>${value}</b>`;
    return r;
  }

  // lightweight refresh for the projection-count input without losing focus
  function renderSummaryOnly(){
    const old = document.querySelector('.summary');
    const fresh = renderSummary();
    old.replaceWith(fresh);
  }

  /* ---------------- settings drawer ---------------- */
  function renderSettingsDrawer(){
    const backdrop = el('div','backdrop');
    backdrop.onclick = (e)=>{ if(e.target===backdrop){ state.settingsOpen=false; render(); } };
    const drawer = el('div','drawer');
    drawer.onclick = (e)=>e.stopPropagation();

    const head = el('div','drawer-head');
    head.innerHTML = `<h2>Configurações</h2>`;
    const closeBtn = el('button','icon-btn','✕');
    closeBtn.onclick = ()=>{ state.settingsOpen=false; render(); };
    head.appendChild(closeBtn);
    drawer.appendChild(head);

    drawer.appendChild(el('div',null,'<div class="field-label" style="margin-bottom:2px">Nichos</div><div style="font-size:12.5px;color:var(--ink-soft)">Ajuste o valor-base mensal e a lista de serviços de cada nicho.</div>'));

    const nichesWrap = el('div');
    nichesWrap.style.display='flex'; nichesWrap.style.flexDirection='column'; nichesWrap.style.gap='12px';
    state.niches.forEach(n=>{
      nichesWrap.appendChild(renderNicheEditor(n));
    });
    drawer.appendChild(nichesWrap);

    const addNicheBtn = el('button','btn btn-secondary','+ Novo nicho');
    addNicheBtn.style.alignSelf='flex-start';
    addNicheBtn.onclick = ()=>{
      const id = 'nicho-'+Date.now();
      state.niches.push({ id, order: state.niches.length+1, icon:'🏢', label:'Novo nicho', baseFee:1200, docs:[{group:'Geral', items:['Descreva aqui o primeiro item de escopo']}] });
      render();
    };
    drawer.appendChild(addNicheBtn);

    drawer.appendChild(el('hr', null));

    drawer.appendChild(el('div',null,'<div class="field-label">Pesos dos fatores de complexidade</div><div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:8px">Percentual somado ao honorário-base quando a resposta aumenta a complexidade.</div>'));
    FACTORS.forEach(f=>{
      const row = el('div','weight-row');
      const label = el('label', null, f.label);
      const range = el('input');
      range.type='range'; range.min=0; range.max=200; range.step=5;
      range.value = state.settings.weights[f.key];
      const val = el('span','wv','+'+state.settings.weights[f.key]+'%');
      range.oninput = (e)=>{ state.settings.weights[f.key] = parseInt(e.target.value,10); val.textContent = '+'+e.target.value+'%'; };
      row.appendChild(label); row.appendChild(range); row.appendChild(val);
      drawer.appendChild(row);
    });

    const projField = el('div','field');
    projField.innerHTML = `<span class="field-label">Nº de contratos na projeção</span>`;
    const projInput = el('input');
    projInput.type='number'; projInput.min=1; projInput.max=99; projInput.value = state.settings.projectionContracts;
    projInput.style.width = '90px';
    projInput.oninput = (e)=>{ state.settings.projectionContracts = Math.max(1, parseInt(e.target.value||'1',10)); };
    projField.appendChild(projInput);
    drawer.appendChild(projField);

    const saveBar = el('div','save-bar');
    const saveBtn = el('button','btn btn-primary','Salvar configurações');
    saveBtn.style.width='100%'; saveBtn.style.justifyContent='center';
    saveBtn.onclick = async ()=>{
      saveBtn.textContent = 'Salvando…';
      await persistAll();
      saveBtn.textContent = '✓ Salvo';
      setTimeout(()=>{ state.settingsOpen=false; render(); }, 500);
    };
    saveBar.appendChild(saveBtn);
    drawer.appendChild(saveBar);

    backdrop.appendChild(drawer);
    return backdrop;
  }

  function renderNicheEditor(n){
    const box = el('div','niche-edit');
    const top = el('div','niche-edit-top');

    const iconField = el('div','field icon-field');
    iconField.innerHTML = `<span class="field-label">Ícone</span>`;
    const iconInput = el('input'); iconInput.type='text'; iconInput.value = n.icon||''; iconInput.maxLength=2;
    iconInput.oninput = e=>{ n.icon = e.target.value; };
    iconField.appendChild(iconInput);
    top.appendChild(iconField);

    const labelField = el('div','field');
    labelField.innerHTML = `<span class="field-label">Nome do nicho</span>`;
    const labelInput = el('input'); labelInput.type='text'; labelInput.value=n.label;
    labelInput.oninput = e=>{ n.label = e.target.value; };
    labelField.appendChild(labelInput);
    top.appendChild(labelField);

    const baseField = el('div','field base-field');
    baseField.innerHTML = `<span class="field-label">Base (R$/mês)</span>`;
    const baseInput = el('input'); baseInput.type='number'; baseInput.min=0; baseInput.step=50; baseInput.value=n.baseFee;
    baseInput.oninput = e=>{ n.baseFee = parseFloat(e.target.value||'0'); };
    baseField.appendChild(baseInput);
    top.appendChild(baseField);

    box.appendChild(top);

    const docsField = el('div','field');
    docsField.style.marginTop = '8px';
    docsField.innerHTML = `<span class="field-label">Itens de escopo (um por linha; use "Área:" para agrupar)</span>`;
    const ta = el('textarea');
    ta.value = n.docs.map(g=>`${g.group}:\n`+g.items.map(i=>'- '+i).join('\n')).join('\n\n');
    ta.oninput = e=>{ n.docs = parseDocsText(e.target.value); };
    docsField.appendChild(ta);
    box.appendChild(docsField);

    if(state.niches.length>1){
      const rm = el('button','remove-niche','Remover nicho');
      rm.onclick = async ()=>{
        state.niches = state.niches.filter(x=>x.id!==n.id);
        if(state.selectedNicheId===n.id) state.selectedNicheId = state.niches[0]?.id || null;
        if(db){ try{ await db.doc('niches/'+n.id).delete(); }catch(e){} }
        else saveLocal();
        render();
      };
      box.appendChild(rm);
    }
    return box;
  }

  /* ---------------- POPs settings drawer ---------------- */
  function renderPopSettingsDrawer(){
    const backdrop = el('div','backdrop');
    backdrop.onclick = (e)=>{ if(e.target===backdrop){ state.popSettingsOpen=false; render(); } };
    const drawer = el('div','drawer');
    drawer.onclick = (e)=>e.stopPropagation();

    const head = el('div','drawer-head');
    head.innerHTML = `<h2>Configurar setores (POPs)</h2>`;
    const closeBtn = el('button','icon-btn','✕');
    closeBtn.onclick = ()=>{ state.popSettingsOpen=false; render(); };
    head.appendChild(closeBtn);
    drawer.appendChild(head);

    drawer.appendChild(el('div',null,'<div class="field-label" style="margin-bottom:2px">Setores</div><div style="font-size:12.5px;color:var(--ink-soft)">Ajuste o resumo e o conteúdo (procedimento) de cada setor, remova ou acrescente novos setores conforme o escritório for mudando.</div>'));

    const wrap = el('div');
    wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.gap='12px';
    state.pops.slice().sort((a,b)=>a.order-b.order).forEach(p=>{
      wrap.appendChild(renderPopEditor(p));
    });
    drawer.appendChild(wrap);

    const addBtn = el('button','btn btn-secondary','+ Novo setor');
    addBtn.style.alignSelf='flex-start';
    addBtn.onclick = ()=>{
      const id = 'setor-'+Date.now();
      state.pops.push({ id, order: state.pops.length+1, icon:'🗂️', label:'Novo setor', resumo:'', docs:[{group:'Geral', items:['Descreva aqui o primeiro item do procedimento']}] });
      render();
    };
    drawer.appendChild(addBtn);

    const saveBar = el('div','save-bar');
    const saveBtn = el('button','btn btn-primary','Salvar setores');
    saveBtn.style.width='100%'; saveBtn.style.justifyContent='center';
    saveBtn.onclick = async ()=>{
      saveBtn.textContent = 'Salvando…';
      await persistPops();
      saveBtn.textContent = '✓ Salvo';
      setTimeout(()=>{ state.popSettingsOpen=false; render(); }, 500);
    };
    saveBar.appendChild(saveBtn);
    drawer.appendChild(saveBar);

    backdrop.appendChild(drawer);
    return backdrop;
  }

  function renderPopEditor(p){
    const box = el('div','niche-edit');
    const top = el('div','niche-edit-top');

    const iconField = el('div','field icon-field');
    iconField.innerHTML = `<span class="field-label">Ícone</span>`;
    const iconInput = el('input'); iconInput.type='text'; iconInput.value = p.icon||''; iconInput.maxLength=2;
    iconInput.oninput = e=>{ p.icon = e.target.value; };
    iconField.appendChild(iconInput);
    top.appendChild(iconField);

    const labelField = el('div','field');
    labelField.innerHTML = `<span class="field-label">Nome do setor</span>`;
    const labelInput = el('input'); labelInput.type='text'; labelInput.value=p.label;
    labelInput.oninput = e=>{ p.label = e.target.value; };
    labelField.appendChild(labelInput);
    top.appendChild(labelField);

    box.appendChild(top);

    const resumoField = el('div','field');
    resumoField.style.marginTop = '8px';
    resumoField.innerHTML = `<span class="field-label">Resumo (aparece no topo do setor)</span>`;
    const resumoInput = el('input'); resumoInput.type='text'; resumoInput.value = p.resumo||'';
    resumoInput.oninput = e=>{ p.resumo = e.target.value; };
    resumoField.appendChild(resumoInput);
    box.appendChild(resumoField);

    const docsField = el('div','field');
    docsField.style.marginTop = '8px';
    docsField.innerHTML = `<span class="field-label">Procedimento (um item por linha; use "Nome do grupo:" para agrupar)</span>`;
    const ta = el('textarea');
    ta.style.minHeight = '180px';
    ta.value = (p.docs||[]).map(g=>`${g.group}:\n`+g.items.map(i=>'- '+i).join('\n')).join('\n\n');
    ta.oninput = e=>{ p.docs = parseDocsText(e.target.value); };
    docsField.appendChild(ta);
    box.appendChild(docsField);

    if(state.pops.length>1){
      const rm = el('button','remove-niche','Remover setor');
      rm.onclick = async ()=>{
        state.pops = state.pops.filter(x=>x.id!==p.id);
        if(state.selectedPopId===p.id) state.selectedPopId = state.pops[0]?.id || null;
        if(db){ try{ await db.doc('pops/'+p.id).delete(); }catch(e){} }
        else saveLocal();
        render();
      };
      box.appendChild(rm);
    }
    return box;
  }

  async function persistPops(){
    if(!db){ saveLocal(); render(); return; }
    try{
      for(const p of state.pops){
        await db.doc('pops/'+p.id).set({ order:p.order, icon:p.icon||'', label:p.label, resumo:p.resumo||'', docs:p.docs });
      }
      state.dbStatus='live';
    }catch(e){ state.dbStatus='offline'; }
  }

  function parseDocsText(text){
    const lines = text.split('\n');
    const groups = [];
    let current = null;
    lines.forEach(raw=>{
      const line = raw.trim();
      if(!line) return;
      if(line.endsWith(':')){
        current = { group: line.slice(0,-1), items: [] };
        groups.push(current);
      } else {
        if(!current){ current = { group:'Geral', items:[] }; groups.push(current); }
        current.items.push(line.replace(/^[-•]\s*/, ''));
      }
    });
    return groups.length ? groups : [{group:'Geral', items:[]}];
  }

  /* ---------------- persistence ---------------- */
  // Cloud (claude artifact db) when available; localStorage fallback for standalone hosting.
  function saveLocal(){
    try{
      localStorage.setItem(LS_KEY, JSON.stringify({ niches: state.niches, pops: state.pops, settings: state.settings }));
      state.dbStatus = 'local';
    }catch(e){ state.dbStatus = 'offline'; }
  }

  function loadLocal(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(raw){
        const data = JSON.parse(raw);
        if(Array.isArray(data.niches) && data.niches.length) state.niches = data.niches;
        if(Array.isArray(data.pops) && data.pops.length) state.pops = data.pops;
        if(data.settings && data.settings.weights) state.settings.weights = {...state.settings.weights, ...data.settings.weights};
        if(data.settings && data.settings.projectionContracts) state.settings.projectionContracts = data.settings.projectionContracts;
        if(!state.niches.find(n=>n.id===state.selectedNicheId)) state.selectedNicheId = state.niches[0]?.id || null;
        if(!state.pops.find(p=>p.id===state.selectedPopId)) state.selectedPopId = state.pops[0]?.id || null;
        applyRoute();
      }
      state.dbStatus = 'local';
    }catch(e){ state.dbStatus = 'offline'; }
  }

  async function persistAll(){
    if(!db){ saveLocal(); render(); return; }
    try{
      for(const n of state.niches){
        await db.doc('niches/'+n.id).set({ order:n.order, icon:n.icon||'', label:n.label, baseFee:n.baseFee, docs:n.docs });
      }
      await db.doc('settings/general').set({ weights: state.settings.weights, projectionContracts: state.settings.projectionContracts });
      state.dbStatus='live';
    }catch(e){ state.dbStatus='offline'; }
  }

  async function initDb(){
    try{
      db = (window.claude && window.claude.use) ? await window.claude.use('db') : null;
    }catch(e){ db = null; }
    if(!db){ loadLocal(); render(); return; }

    try{
      const snap = await db.collection('niches').get();
      if(!snap.empty){
        state.niches = snap.docs.map(d=>({ id:d.id, ...d.data() })).sort((a,b)=>(a.order||0)-(b.order||0));
        if(!state.niches.find(n=>n.id===state.selectedNicheId)) state.selectedNicheId = state.niches[0]?.id || null;
      }
      const s = await db.doc('settings/general').get();
      if(s.exists){
        const data = s.data();
        if(data.weights) state.settings.weights = {...state.settings.weights, ...data.weights};
        if(data.projectionContracts) state.settings.projectionContracts = data.projectionContracts;
      }
      const popsSnap = await db.collection('pops').get();
      if(!popsSnap.empty){
        state.pops = popsSnap.docs.map(d=>({ id:d.id, ...d.data() })).sort((a,b)=>(a.order||0)-(b.order||0));
        if(!state.pops.find(p=>p.id===state.selectedPopId)) state.selectedPopId = state.pops[0]?.id || null;
      }
      applyRoute();
      state.dbStatus='live';
    }catch(e){ state.dbStatus='offline'; }
    render();
  }

  applyRoute();
  render();
  initDb();
})();
</script>
